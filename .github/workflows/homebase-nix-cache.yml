name: Homebase Nix cache

on:
  push:
    branches: [homebase]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebase-nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Require cache write token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: volker-schukai-herdr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Validate flake outputs
        run: nix flake check --all-systems --no-build --print-build-logs

      - name: Build Linux package
        run: nix build .#packages.x86_64-linux.herdr --print-build-logs
